name: Reusable RC Deployment

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      comment_user:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      package_name:
        required: true
        type: string
      rc_version:
        required: false
        type: string
      deployment_id:
        required: false
        type: string
    outputs:
      rc_version:
        description: "Generated RC version"
        value: ${{ jobs.deploy.outputs.rc_version }}
      deployment_id:
        description: "Generated Deployment ID"
        value: ${{ jobs.deploy.outputs.deployment_id }}
    secrets:
      app_id:
        required: true
      private_key:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.versioning.outputs.rc_version }}
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}

      - name: Check permissions
        if: ${{ inputs.phase == '1' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: "${{ inputs.comment_user }}"
            });
            const allowed = ['admin', 'write'].includes(permission.permission);
            if (!allowed) core.setFailed('User does not have permission to deploy');

      - name: Get PR details
        if: ${{ inputs.phase == '1' }}
        id: get_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            if (!pr.draft) core.setFailed('Deployment only allowed for Draft PRs');
            if (!pr.head.ref.startsWith('release/')) core.setFailed('Deployment only allowed for release branches');
            return pr;

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.get_pr.outputs.result).head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create GitHub Deployment
        if: ${{ inputs.phase == '1' }}
        id: create_deployment
        run: |
          REF="${{ fromJson(steps.get_pr.outputs.result).head.ref }}"
          DEPLOY_ID=$(gh api repos/:owner/:repo/deployments \
            -f ref="$REF" \
            -f environment="testpypi" \
            -f description="Deploying RC version" \
            --jq '.id')
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set Deployment In-Progress
        if: ${{ inputs.phase == '1' }}
        run: |
          gh api repos/:owner/:repo/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -f state="in_progress" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate RC Version
        if: ${{ inputs.phase == '1' }}
        id: versioning
        run: |
          BRANCH_NAME="${{ fromJson(steps.get_pr.outputs.result).head.ref }}"
          BASE_TAG="${BRANCH_NAME#release/}"
          BASE_VERSION="${BASE_TAG#v}"
          EPOCH=$(date +%s)
          RC_VERSION="${BASE_VERSION}rc${EPOCH}"
          echo "rc_version=${RC_VERSION}" >> $GITHUB_OUTPUT
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${RC_VERSION}" >> $GITHUB_ENV
          echo "HATCH_VCS_VERSION_FILE_VERSION=${RC_VERSION}" >> $GITHUB_ENV

      - name: Setup uv
        if: ${{ inputs.phase == '1' }}
        uses: astral-sh/setup-uv@v5

      - name: Build Package
        if: ${{ inputs.phase == '1' }}
        run: |
          uv sync --locked
          uv build

      - name: Upload dist
        if: ${{ inputs.phase == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Comment on PR
        if: ${{ inputs.phase == '2' }}
        uses: actions/github-script@v7
        env:
          RC_VERSION: ${{ inputs.rc_version }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const rcVersion = process.env.RC_VERSION;
            const packageName = process.env.PACKAGE_NAME;
            
            if (!rcVersion) {
              core.setFailed("rc_version is missing in Phase 2");
              return;
            }

            const body = `🚀 **TestPyPI Deployment Successful!**

            Version: \`${rcVersion}\`
            Install command:
            \`\`\`bash
            pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ${packageName}==${rcVersion}
            \`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: body
            });

      - name: Update Deployment Success
        if: ${{ inputs.phase == '2' }}
        run: |
          gh api repos/:owner/:repo/deployments/${{ inputs.deployment_id }}/statuses \
            -f state="success" \
            -f environment_url="https://test.pypi.org/project/${{ inputs.package_name }}/${{ inputs.rc_version }}/"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}