name: Reusable Release Preparation

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: stable
      target_branch:
        required: false
        type: string
        default: main
      exclude_list:
        required: false
        type: string
        default: "chore,test,ci,docs,style"

    secrets:
      app_id:
        required: true
      private_key:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.target_branch }}

      - name: Generate Changelog
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const excludeInput = "${{ inputs.exclude_list }}";

            const range = `origin/${{ inputs.base_branch }}..origin/${{ inputs.target_branch }}`;
            const logs = execSync(`git log ${range} --format="%s"`).toString().split('\n').filter(Boolean);

            const categories = {
              feat: 'Features',
              fix: 'Bug Fixes',
              perf: 'Performance',
              refactor: 'Refactor'
            };
            const excludeTypes = new Set(excludeInput.split(',').map(s => s.trim()));

            const structuredLogs = {};
            for (const msg of logs) {
              const match = msg.match(/^(\w+)(\(([^)]+)\))?!?: (.*)/);
              if (!match) continue;

              const type = match[1];
              const scope = match[3];
              const subject = match[4];

              if (excludeTypes.has(type) || !categories[type]) continue;

              if (!structuredLogs[type]) structuredLogs[type] = [];
              const line = scope ? `* **${scope}**: ${subject}` : `* ${subject}`;
              structuredLogs[type].push(line);
            }

            let changelog = `## Release ${{ inputs.tag_name }}\n\n`;
            let hasContent = false;
            for (const [type, title] of Object.entries(categories)) {
              const items = structuredLogs[type];
              if (items && items.length > 0) {
                changelog += `### ${title}\n${items.join('\n')}\n\n`;
                hasContent = true;
              }
            }

            if (!hasContent) changelog += "Maintenance and internal improvements.\n\n";

            core.setOutput('changelog', changelog);

      - name: Create Release Branch
        run: |
          git config user.name "fedi-libs-release-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          git checkout -B release/${{ inputs.tag_name }} origin/${{ inputs.target_branch }}
          git push origin release/${{ inputs.tag_name }} --force

      - name: Create Pull Request with gh
        run: |
          cat << 'EOF' > pr_body.txt
          ${{ steps.changelog.outputs.changelog }}
          EOF

          gh pr create \
            --title "Release: ${{ inputs.tag_name }}" \
            --body-file pr_body.txt \
            --base "${{ inputs.base_branch }}" \
            --head "release/${{ inputs.tag_name }}" \
            --draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
