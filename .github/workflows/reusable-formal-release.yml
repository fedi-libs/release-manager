name: Reusable Formal Release

on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      pr_body:
        required: true
        type: string
    secrets:
      app_id:
        required: true
      private_key:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
            version: ">=0.7.21,<0.10"

      - name: Build Package
        run: |
          uv sync --locked
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Update and Publish GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branchName = "${{ inputs.head_ref }}";
            const tagName = branchName.replace('release/', '');
            const prBody = `${{ inputs.pr_body }}`;

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const draftRelease = releases.find(r => r.tag_name === tagName && r.draft);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                body: prBody,
                draft: false
              });
            } else {
              core.setFailed(`No draft release found for tag: ${tagName}`);
            }
