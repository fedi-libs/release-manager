name: Reusable Formal Release

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      pr_body:
        required: true
        type: string
    secrets:
      app_id:
        required: true
      private_key:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}

      - name: Checkout code
        if: ${{ inputs.phase == '1' }}
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup uv
        if: ${{ inputs.phase == '1' }}
        uses: astral-sh/setup-uv@v5

      - name: Build Package
        if: ${{ inputs.phase == '1' }}
        run: |
          uv sync --locked
          uv build

      - name: Upload dist
        if: ${{ inputs.phase == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Update and Publish GitHub Release
        if: ${{ inputs.phase == '2' }}
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ inputs.pr_body }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branchName = "${{ inputs.head_ref }}";
            const tagName = branchName.replace('release/', '');
            const prBody = process.env.PR_BODY;

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const draftRelease = releases.find(r => r.tag_name === tagName && r.draft);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                body: prBody,
                draft: false
              });
              console.log(`Successfully published release: ${tagName}`);
            } else {
              core.setFailed(`No draft release found for tag: ${tagName}`);
            }